<p class="summary" aria-live="polite"><span data-summary="all">一筆預約從選卡、提出需求到收到訂單號。</span>
<span data-summary="A" hidden>客戶選本行卡，前段完成代碼化設定，適用時由本行驗身。</span>
<span data-summary="B" hidden>客戶交代接送條件，外部 Agent 確認並留存可查車的範圍。</span>
<span data-summary="C" hidden>外部 Agent 經 Visa／Mastercard 商務方案或其合作方查車，車商回傳報價、效期與條款。</span>
<span data-summary="D" hidden>外部 Agent 比對客戶條件與商務介接方回傳的最新車商報價及承載。</span>
<span data-summary="E" hidden>客戶核准同一版結帳，外部 Agent 經商務介接送建單，支付介接另交付憑證；適用時再做 3DS。</span>
<span data-summary="F" hidden>本行經卡組織和收單行回覆車商。車商經商務介接回傳授權結果、接單狀態與訂單號。外部 Agent 核對兩邊結果，均成功後在原對話回覆「已預約」及訂單號。</span></p>
</section>

<script>
const buttons = Array.from(document.querySelectorAll('[data-select]'));
const elements = Array.from(document.querySelectorAll('svg [data-phase]'), node => [node, node.dataset.phase.split(' ')]);
const summaries = Array.from(document.querySelectorAll('[data-summary]'));
function selectPhase(phase) {
  for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.select === phase));
  for (const [node, stages] of elements) {
    const active = stages.includes(phase);
    node.classList.toggle('is-active', phase !== 'all' && active);
    node.classList.toggle('is-muted', phase !== 'all' && !active);
  }
  for (const summary of summaries) summary.hidden = summary.dataset.summary !== phase;
}
for (const button of buttons) button.addEventListener('click', () => selectPhase(button.dataset.select));
</script>
